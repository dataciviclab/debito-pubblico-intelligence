name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
      - "scripts/**"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: dpi-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[pipeline]"

      - name: Run datasets
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: make run-all

      - name: BDAP
        run: make bdap

      - name: Signals + reconcile + panorama
        run: make signals reconcile panorama

      - name: Test
        run: make test

      - name: GCP Auth (for GCS push)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync to GCS
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: |
          for slug_dir in out/data/clean/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            year=$(ls "$slug_dir" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "No clean output for $slug" && continue
            gsutil -m rsync -r "${slug_dir}${year}/" "gs://dataciviclab-clean/debito_pubblico_intelligence/$slug/$year/"
            echo "$slug clean synced"
          done
          for slug_dir in out/data/mart/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            year=$(ls "$slug_dir" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "No mart output for $slug" && continue
            gsutil -m rsync -r "${slug_dir}${year}/" "gs://dataciviclab-mart/debito_pubblico_intelligence/$slug/$year/"
            echo "$slug mart synced"
          done

      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: "debito_pubblico_intelligence"
          flat: "false"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No changes in data/ to commit"
          else
            git commit -m "ci: update data/ [skip ci]"
            git push
          fi
