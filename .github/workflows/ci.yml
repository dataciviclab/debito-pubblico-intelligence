name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

  validate-config:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      globs: "datasets"
      years: "from-config"
