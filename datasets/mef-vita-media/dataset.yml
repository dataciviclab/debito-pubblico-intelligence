root: "../../out"
schema_version: 1
dataset:
  name: "mef_vita_media"
  source_id: "mef_tesoro"
  tags: [finanza-pubblica, debito, titoli, vita-media, mef]
  category: finanza-pubblica
  years: [2026]
raw:
  output_policy: overwrite
  sources:
    - name: "mef_vita_media"
      type: "script"
      args: { command: "python preprocess.py raw_input.csv", output: "raw_input.csv", filename: "raw_input.csv" }
      primary: true
clean:
  sql: "sql/clean.sql"
  read: { source: auto, mode: latest, delim: ",", encoding: utf-8, header: true }
  required_columns: [mese, tipologia, vita_media_mesi]
  validate: { not_null: [mese, tipologia], min_rows: 30 }
mart:
  tables:
    - name: "mart_vita_media"
      sql: "sql/mart_vita_media.sql"
  required_tables: ["mart_vita_media"]
  validate:
    table_rules:
      mart_vita_media: { not_null: [mese, tipologia], min_rows: 30 }
