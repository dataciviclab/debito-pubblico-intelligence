root: "../../out"
schema_version: 1

dataset:
  name: "mef_scadenze_isin"
  source_id: "mef_tesoro"
  tags: [finanza-pubblica, debito, titoli, scadenze, isin, mef]
  category: finanza-pubblica
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "mef_scadenze_isin"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns: [isin, tipo, emissione, scadenza, cedola_pct, valuta, circolante_riv_eur, circolante_nom_eur, data_ref]
  validate:
    not_null: [isin, scadenza]
    min_rows: 300

mart:
  tables:
    - name: "mart_scadenze_isin"
      sql: "sql/mart_scadenze_isin.sql"
    - name: "mart_rollover_12m"
      sql: "sql/mart_rollover_12m.sql"
  required_tables: ["mart_scadenze_isin"]
  validate:
    table_rules:
      mart_scadenze_isin:
        not_null: [isin, scadenza]
        min_rows: 300
