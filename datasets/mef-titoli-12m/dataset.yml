root: "../../out"
schema_version: 1
dataset:
  name: "mef_titoli_12m"
  source_id: "mef_tesoro"
  tags: [finanza-pubblica, debito, titoli, scadenza, rollover, mef]
  category: finanza-pubblica
  years: [2026]
raw:
  output_policy: overwrite
  sources:
    - name: "mef_titoli_12m"
      type: "script"
      args: { command: "python preprocess.py raw_input.csv", output: "raw_input.csv", filename: "raw_input.csv" }
      primary: true
clean:
  sql: "sql/clean.sql"
  read: { source: auto, mode: latest, delim: ",", encoding: utf-8, header: true }
  required_columns: [mese_scadenza, tipologia, valore_mln_eur]
  validate: { not_null: [mese_scadenza, tipologia], min_rows: 20 }
mart:
  tables:
    - name: "mart_titoli_12m"
      sql: "sql/mart_titoli_12m.sql"
  required_tables: ["mart_titoli_12m"]
  validate:
    table_rules:
      mart_titoli_12m: { not_null: [mese_scadenza, tipologia], min_rows: 20 }
