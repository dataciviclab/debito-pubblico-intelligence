root: "../../out"
schema_version: 1

dataset:
  name: "fpi_debito_pa"
  source_id: "banca_ditalia"
  tags: [finanza-pubblica, debito, fpi, banca-ditalia, amministrazioni-pubbliche]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 1960
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "fpi_debito_pa"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: utf-8
    header: true
  required_columns: [data, tavola, tavola_nome, codice, controparte, descrizione, valore_mln_eur, fonte]
  validate:
    not_null: [data, tavola, codice]
    min_rows: 50000

mart:
  tables:
    - name: "mart_debito_ap"
      sql: "sql/mart_debito_ap.sql"
    - name: "mart_fabbisogno"
      sql: "sql/mart_fabbisogno.sql"
    - name: "mart_detentori"
      sql: "sql/mart_detentori.sql"
    - name: "mart_variazione_mensile"
      sql: "sql/mart_variazione_mensile.sql"
    - name: "mart_vita_residua"
      sql: "sql/mart_vita_residua.sql"
    - name: "mart_valuta"
      sql: "sql/mart_valuta.sql"
    - name: "mart_liquidita"
      sql: "sql/mart_liquidita.sql"
  required_tables: ["mart_debito_ap"]
  validate:
    table_rules:
      mart_debito_ap:
        not_null: [data, codice]
        min_rows: 10000
      mart_fabbisogno:
        not_null: [data, codice]
        min_rows: 1000
      mart_detentori:
        not_null: [data, codice]
        min_rows: 500
      mart_vita_residua:
        not_null: [data, codice, unita]
        min_rows: 4000
      mart_valuta:
        not_null: [data, codice]
        min_rows: 20000
      mart_liquidita:
        not_null: [data, codice, natura]
        min_rows: 10000
