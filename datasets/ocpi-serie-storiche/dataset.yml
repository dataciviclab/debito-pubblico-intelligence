root: "../../out"
schema_version: 1

dataset:
  name: "ocpi_serie_storiche"
  source_id: "ocpi"
  tags: [finanza-pubblica, debito, pil, i-g, saldo-primario, ocpi, serie-storiche]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 1861
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "ocpi_serie_storiche"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  required_columns: [serie, nome, unita, anno, valore]
  validate:
    not_null: [serie, anno]
    min_rows: 3000

mart:
  tables:
    - name: "mart_serie_storiche"
      sql: "sql/mart_serie_storiche.sql"
  required_tables: ["mart_serie_storiche"]
  validate:
    table_rules:
      mart_serie_storiche:
        not_null: [serie, anno]
        min_rows: 3000
